<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady · running app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,400..900;1,50..150,400..900&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── Steady · design tokens ───────── */
.scr{
  --bg:#F4F2EE; --raised:#FFFFFF; --well:#EAE7E1; --well2:#E1DDD6;
  --ink:#16171A; --ink2:#5C5E64; --ink3:#8C8E93; --rule:#E2DED7; --rule2:#CDC8C0;
  --acc:#D63A1F; --accInk:#B8301A; --accT:rgba(214,58,31,.11);
  --e0:#D2CCC2; --e1:#F5A386; --e2:#EC6944; --e3:#D63A1F;
  --good:#2C7649; --goodT:#E1EEE5; --warn:#8F560A; --warnT:#F5E6CC;
  --btn:#16171A; --btnInk:#F7F5F1; --scrim:rgba(22,23,26,.34);
  --glow:radial-gradient(110% 62% at 100% 4%, rgba(214,92,52,.17), rgba(214,92,52,0) 64%);
  --fb:'Hanken Grotesk'; --fd:'Anybody'; --fd-st:68%; --fd-it:italic; --fd-w:800; --fd-ls:-.02em; --fh-st:82%;
}
.scr[data-theme=dark]{
  --bg:#121315; --raised:#1C1D20; --well:#232428; --well2:#2C2D31;
  --ink:#EFEDE8; --ink2:#A7A6A2; --ink3:#75757A; --rule:rgba(255,255,255,.085); --rule2:rgba(255,255,255,.16);
  --acc:#FF7A57; --accInk:#FF9473; --accT:rgba(255,122,87,.15);
  --e0:#3B3C41; --e1:#A94C36; --e2:#E2603E; --e3:#FF7A57;
  --good:#86C9A0; --goodT:rgba(134,201,160,.13); --warn:#E8B66A; --warnT:rgba(232,182,106,.13);
  --btn:#EFEDE8; --btnInk:#121315; --scrim:rgba(0,0,0,.55);
  --glow:radial-gradient(120% 70% at 100% 0%, rgba(238,102,70,.16), rgba(238,102,70,0) 60%);
}

/* ───────── Screen shell ───────── */
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--fb),system-ui,sans-serif;font-stretch:100%;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;text-align:left}
.scr *{box-sizing:border-box}
.scr button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr .sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:4px 30px 0 34px;font-size:16px;font-weight:600;letter-spacing:-.01em;z-index:6;
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.scr .sb.clear{background:transparent}
.scr .sb svg{display:block}
.scr .body{position:absolute;top:50px;left:0;right:0;bottom:84px;overflow-y:auto;overflow-x:hidden;padding:0 20px 28px;scrollbar-width:none;z-index:1}
.scr .body::-webkit-scrollbar{display:none}
.scr.notab .body{bottom:0}
.scr.hasfoot .body{padding-bottom:120px}
.scr .home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:9}
.scr .glow{position:absolute;left:0;right:0;top:0;height:440px;background:var(--glow);pointer-events:none;z-index:0}

/* Tab bar: five equal tabs, icon + label */
.scr .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:grid;grid-template-columns:repeat(5,1fr);
  padding:7px 6px 0;border-top:1px solid var(--rule);background:var(--bg);z-index:5}
.scr .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:500;letter-spacing:.01em}
.scr .tab.on{color:var(--ink)}
.scr .tab.on svg{stroke-width:2}

/* Footer action area (flows) */
.scr .foot{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;z-index:5;
  background:linear-gradient(to bottom, color-mix(in srgb,var(--bg) 0%,transparent), var(--bg) 22%)}
.scr .foot .hint{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:10px}

/* ───────── Type ───────── */
.scr .disp{font-family:var(--fd),var(--fb),sans-serif;font-stretch:var(--fd-st);font-style:var(--fd-it);font-weight:var(--fd-w);letter-spacing:var(--fd-ls);line-height:.9;font-variant-numeric:tabular-nums}
.scr .hl{font-family:var(--fh,var(--fd)),var(--fb),sans-serif;font-stretch:var(--fh-st);font-style:var(--fd-it);font-weight:var(--fd-w);line-height:1.02;letter-spacing:-.01em}
.scr .d1{font-size:124px}
.scr .d2{font-size:92px}
.scr .d3{font-size:64px}
.scr .d4{font-size:44px}
.scr .d5{font-size:30px;letter-spacing:-.015em}
.scr .unit{font-family:var(--fb);font-style:normal;font-stretch:100%;font-weight:500;letter-spacing:0;color:var(--ink3)}
.scr .page-t{font-family:var(--fh,var(--fd)),var(--fb);font-style:var(--fd-it);font-size:34px;font-weight:var(--fd-w);font-stretch:var(--fh-st);letter-spacing:-.01em;line-height:1.05;margin:10px 0 4px}
.scr .h1{font-family:var(--fh,var(--fd)),var(--fb);font-style:var(--fd-it);font-size:27px;font-weight:var(--fd-w);font-stretch:var(--fh-st);letter-spacing:-.005em;line-height:1.1}
.scr .h2{font-size:20px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.scr .h3{font-size:16px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.scr .lead{font-size:17px;line-height:1.4;color:var(--ink2)}
.scr .sm{font-size:13px;line-height:1.42}
.scr .xs{font-size:12px;line-height:1.35}
.scr .mute{color:var(--ink2)}
.scr .faint{color:var(--ink3)}
.scr .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.085em;text-transform:uppercase;color:var(--ink3);line-height:1.2}
.scr .eyebrow b{color:var(--ink);font-weight:600}
.scr .num{font-variant-numeric:tabular-nums}
.scr .w5{font-weight:500}.scr .w6{font-weight:600}
.scr .acc{color:var(--accInk)}
.scr .goodc{color:var(--good)}.scr .warnc{color:var(--warn)}
.scr .xp{text-decoration:underline dotted;text-decoration-color:var(--ink3);text-underline-offset:4px;text-decoration-thickness:1.5px;cursor:pointer}
.scr mark{background:none;color:inherit;font-weight:600;box-shadow:inset 0 -.42em 0 var(--accT)}
.scr s{color:var(--ink3);text-decoration-thickness:1px}

/* ───────── Layout atoms ───────── */
.scr .sec{border-top:1px solid var(--rule);padding:20px 0 22px}
.scr .sec.tight{padding:14px 0 16px}
.scr .sec.nob{border-top:0}
.scr .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.scr .hd .r{font-size:13px;color:var(--ink2);white-space:nowrap}
.scr .flex{display:flex;align-items:center;gap:10px}
.scr .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scr .grow{flex:1;min-width:0}
.scr .gap4{height:4px}.scr .gap8{height:8px}.scr .gap12{height:12px}.scr .gap16{height:16px}.scr .gap20{height:20px}.scr .gap24{height:24px}.scr .gap32{height:32px}
.scr .topnav{display:flex;align-items:center;justify-content:space-between;height:48px;margin:0 -6px}
.scr .ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.scr .ib.well{background:var(--well)}
.scr .pillbtn{height:34px;padding:0 13px 0 11px;border-radius:17px;border:1px solid var(--rule2);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500}
.scr .link{font-size:13.5px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.scr .link svg{color:var(--ink3)}

/* Rows */
.scr .rows > .row:first-child{border-top:0}
.scr .row{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 0;border-top:1px solid var(--rule)}
.scr .row .ic{width:34px;height:34px;border-radius:10px;background:var(--well);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.scr .row .t{font-size:15px;font-weight:500;line-height:1.3}
.scr .row .s{font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
.scr .row .v{text-align:right;font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.scr .row .v small{display:block;font-size:12px;font-weight:400;color:var(--ink2);margin-top:1px}
.scr .chev{color:var(--ink3);flex:none}

/* Chips & grades */
.scr .chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--well);color:var(--ink2);
  font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.scr .chip svg{flex:none}
.scr .chip.good{background:var(--goodT);color:var(--good)}
.scr .chip.warn{background:var(--warnT);color:var(--warn)}
.scr .chip.acc{background:var(--accT);color:var(--accInk)}
.scr .chip.ink{background:var(--ink);color:var(--bg)}
.scr .chip.line{background:transparent;border:1px solid var(--rule2)}
.scr .grade{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;border:1px solid var(--rule2);
  font-size:10.5px;font-weight:600;color:var(--ink2);flex:none;line-height:1}
.scr .gradechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.scr .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}

/* Buttons */
.scr .btn{height:56px;width:100%;border-radius:14px;background:var(--btn);color:var(--btnInk);display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.scr .btn.split{justify-content:space-between;padding:0 18px 0 16px}
.scr .btn .sub{font-size:13px;font-weight:500;opacity:.62}
.scr .btn2{height:50px;width:100%;border-radius:14px;border:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--ink)}
.scr .btn3{height:44px;border-radius:12px;background:var(--well);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500;padding:0 14px}
.scr .tools{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule2);border-radius:14px;gap:0;overflow:hidden}
.scr .tools button{height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink)}
.scr .tools button + button{border-left:1px solid var(--rule)}
.scr .tools button svg{color:var(--ink2)}
.scr .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Segmented / choice */
.scr .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--well);border-radius:12px;padding:3px}
.scr .seg button{height:36px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink2);text-align:center}
.scr .seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05)}
.scr[data-theme=dark] .seg button.on{background:var(--well2);box-shadow:none}
.scr .choice{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border:1px solid var(--rule2);border-radius:14px;margin-bottom:10px;width:100%}
.scr .choice.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.scr .choice .rad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule2);flex:none;margin-top:1px;position:relative}
.scr .choice.on .rad{border-color:var(--ink)}
.scr .choice.on .rad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink)}
.scr .choice .t{font-size:15.5px;font-weight:600;line-height:1.3}
.scr .choice .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.scr .choice .tag{margin-left:auto;flex:none}
.scr .toggle{width:46px;height:28px;border-radius:14px;background:var(--well2);position:relative;flex:none}
.scr .toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.scr .toggle.on{background:var(--ink)}
.scr .toggle.on::after{left:21px;background:var(--bg)}
.scr .daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scr .daypick button{height:46px;border-radius:12px;border:1px solid var(--rule2);font-size:14px;font-weight:600;text-align:center}
.scr .daypick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scr .daypick button.long{position:relative}
.scr .daypick button.long::after{content:"L";position:absolute;top:3px;right:5px;font-size:9px;opacity:.7}
.scr .tagset{display:flex;flex-wrap:wrap;gap:8px}
.scr .tagset button{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--rule2);font-size:14px;font-weight:500}
.scr .tagset button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scr .field{height:52px;border-radius:12px;border:1px solid var(--rule2);display:flex;align-items:center;padding:0 14px;gap:10px;font-size:16px;background:var(--raised)}
.scr .field .ph{color:var(--ink3)}

/* RPE scale */
.scr .rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scr .rpe button{height:52px;border-radius:9px;background:var(--well);font-size:17px;font-weight:600;text-align:center;font-family:var(--fh,var(--fd)),var(--fb);font-style:var(--fd-it);font-stretch:var(--fh-st);position:relative}
.scr .rpe button.on{background:var(--ink);color:var(--bg)}
.scr .rpe-words{display:grid;grid-template-columns:2fr 2fr 2fr 2fr 2fr;margin-top:7px;font-size:11.5px;color:var(--ink3)}
.scr .rpe-words span{border-top:2px solid var(--rule2);padding-top:5px;margin-right:4px}
.scr .rpe-words span.on{border-color:var(--ink);color:var(--ink);font-weight:500}

/* Bars / progress */
.scr .bar{height:6px;border-radius:3px;background:var(--well2);overflow:hidden;position:relative}
.scr .bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.scr .bar.acc > i{background:var(--acc)}
.scr .ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scr .ladder .st{height:8px;border-radius:2px;background:var(--well2);position:relative;overflow:hidden}
.scr .ladder .st.done{background:var(--ink)}
.scr .ladder .st > i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.scr .ladder-l{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}
.scr .ladder-l span{font-size:11.5px;color:var(--ink3);font-weight:500}
.scr .ladder-l span.on{color:var(--ink);font-weight:600}

/* ───────── The session strip (bespoke) ───────── */
.scr .strip{position:relative;height:64px;width:100%}
.scr .strip .blk{position:absolute;bottom:0;border-radius:4px 4px 1px 1px;min-width:1.5px}
.scr .strip .e0{background:var(--e0)}
.scr .strip .e1{background:var(--e1)}
.scr .strip .e2{background:var(--e2)}
.scr .strip .e3{background:var(--e3)}
.scr .strip .str{background:transparent;border:1.5px dashed var(--ink3);border-bottom:0}
.scr .strip .ghost{opacity:.3}
.scr .strip.v-timeline .base{display:none}
.scr .pvd{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px}
.scr .pvd + .pvd{margin-top:8px}
.scr .pvd > span{font-size:12px;font-weight:600;color:var(--ink2)}
.scr .wk .sp{display:flex;align-items:center}
.scr .strip .blk.rep{background:repeating-linear-gradient(90deg,var(--e3) 0 2.5px,transparent 2.5px 4.5px)!important}
.scr .strip .blk.rep.e2{background:repeating-linear-gradient(90deg,var(--e2) 0 3px,transparent 3px 5px)!important}
.scr .strip .blk.rep.e1{background:repeating-linear-gradient(90deg,var(--e1) 0 3px,transparent 3px 5px)!important}
.scr .strip .miss{background:repeating-linear-gradient(135deg,var(--rule2) 0 1.5px,transparent 1.5px 5px)}
.scr .strip .base{position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rule2)}
.scr .strip .now{position:absolute;top:-22px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink);z-index:3}
.scr .strip .now b{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;
  padding:2px 6px;border-radius:5px;white-space:nowrap;line-height:1.3}
.scr .strip .gel{position:absolute;bottom:calc(100% + 4px);width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.scr .strip-l{position:relative;height:30px;margin-top:8px;font-size:12px;color:var(--ink2)}
.scr .strip-l span{position:absolute;top:0;white-space:nowrap;line-height:1.25}
.scr .strip-l span b{display:block;font-weight:600;color:var(--ink);font-size:12.5px}
.scr .strip-l span.r{text-align:right;transform:translateX(-100%)}
.scr .strip-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
.scr .strip-ax span{white-space:nowrap}
.scr .mini{position:relative;height:16px}
.scr .mini .blk{border-radius:1.5px 1.5px 0 0}

/* Week timetable */
.scr .wk .row{min-height:46px;padding:7px 0;gap:10px}
.scr .wk .day{width:34px;font-size:13px;font-weight:600;color:var(--ink2);flex:none}
.scr .wk .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .wk .nm small{display:block;font-size:12px;color:var(--ink3);font-weight:400;margin-top:1px}
.scr .wk .sp{width:92px;flex:none}
.scr .wk .stt{width:66px;flex:none;text-align:right;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.scr .wk .row.today{background:var(--well);margin:0 -12px;padding:7px 12px;border-radius:12px;border-top-color:transparent}
.scr .wk .row.today + .row{border-top-color:transparent}
.scr .wk .row.rest .nm{color:var(--ink3);font-weight:400}

/* Notes (why/what changed) */
.scr .note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--well)}
.scr .note.warn{background:var(--warnT)}
.scr .note.warn .ni{color:var(--warn)}
.scr .note .ni{flex:none;margin-top:1px;color:var(--ink2)}
.scr .note .nt{font-size:14px;line-height:1.42}
.scr .note .nt b{font-weight:600}
.scr .note .nl{margin-top:6px}
.scr .rulel{border-left:2px solid var(--ink);padding:2px 0 2px 14px}

/* Sheets */
.scr .scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.scr .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-radius:26px 26px 0 0;z-index:21;padding:8px 20px 34px;max-height:92%;overflow-y:auto;scrollbar-width:none;
  box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.scr[data-theme=dark] .sheet{background:#1D1E21}
.scr .sheet::-webkit-scrollbar{display:none}
.scr .grab{width:38px;height:5px;border-radius:3px;background:var(--rule2);margin:0 auto 14px}
.scr .layer{border-top:1px solid var(--rule);padding:16px 0}
.scr .layer .lh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.scr .layer .lh .n{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.08em;margin-right:8px}
.scr .layer p{margin:8px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.scr .layer p b{color:var(--ink);font-weight:600}
.scr .bubble{background:var(--well);border-radius:18px 18px 4px 18px;padding:11px 14px;font-size:15px;margin-left:56px}
.scr .answer{font-size:15px;line-height:1.5;margin-top:16px}
.scr .answer p{margin:0 0 10px}

/* Live run */
.scr .live-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.scr .rec{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.scr .rec i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.scr .kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.scr .kpis > div{padding:14px 0 14px 14px;border-left:1px solid var(--rule)}
.scr .kpis > div:first-child{border-left:0;padding-left:0}
.scr .kpis .k{font-family:var(--fd),var(--fb);font-style:var(--fd-it);font-size:36px;font-weight:var(--fd-w);font-stretch:var(--fd-st);letter-spacing:var(--fd-ls);line-height:1;font-variant-numeric:tabular-nums}
.scr .kpis .k small{font-family:var(--fb);font-style:normal;font-size:14px;font-weight:500;font-stretch:100%;color:var(--ink3);letter-spacing:0;margin-left:2px}
.scr .kpis .l{font-size:12px;color:var(--ink2);margin-top:6px}
.scr .ctrl{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.scr .ctrl .side{width:64px;height:64px;border-radius:32px;background:var(--well);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:500;gap:2px;color:var(--ink)}
.scr .ctrl .main{width:96px;height:96px;border-radius:48px;background:var(--btn);color:var(--btnInk);display:flex;align-items:center;justify-content:center}
.scr .cue{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)}
.scr .cue q{quotes:"“" "”";color:var(--ink);font-weight:500}
.scr .banner{border-radius:16px;padding:16px;background:var(--warnT)}
.scr .banner .bt{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.scr .banner .bs{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.45}

/* Charts */
.scr .bars{display:flex;align-items:flex-end;gap:5px;height:120px;position:relative}
.scr .bars .b{flex:1;border-radius:4px 4px 1px 1px;background:var(--well2);position:relative}
.scr .bars .b.on{background:var(--ink)}
.scr .bars .b.part{background:repeating-linear-gradient(135deg,var(--rule2) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px var(--rule2)}
.scr .bars .b .cv{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.scr .bars-x{display:flex;gap:5px;margin-top:7px}
.scr .bars-x span{flex:1;text-align:center;font-size:10.5px;color:var(--ink3)}
.scr .bars-x span.on{color:var(--ink);font-weight:600}
.scr .bars .b .pv{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.scr .rng{position:relative;height:22px}
.scr .rng .tr{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule)}
.scr .rng .band{position:absolute;top:5px;height:12px;border-radius:6px;background:var(--e1)}
.scr .rng .pt{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
.scr .rng .mk{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:var(--ink)}
.scr .splits .sr{display:grid;grid-template-columns:22px 52px 1fr 42px 36px;align-items:center;gap:10px;height:34px;font-size:14px;border-top:1px solid var(--rule)}
.scr .splits .sr.h{height:28px;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-top:0}
.scr .splits .sr .sbar{height:8px;border-radius:2px;background:var(--e1)}
.scr .splits .sr .sbar.e3{background:var(--e3)}
.scr .splits .sr .r{text-align:right;color:var(--ink2)}

/* Map */
.scr .map{position:relative;height:190px;border-radius:14px;overflow:hidden;background:var(--well)}
.scr .map svg{position:absolute;inset:0}

/* Lists inside sheets/process */
.scr .steps .st{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-top:1px solid var(--rule);font-size:14.5px}
.scr .steps .st:first-child{border-top:0}
.scr .steps .st .i{font-size:12px;color:var(--ink3);font-weight:600}
.scr .steps .st .d{font-weight:600;font-variant-numeric:tabular-nums}
.scr .steps .st .w{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.scr .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}

.scr .ava{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none}
.scr .kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.scr .kv:first-child{border-top:0}
.scr .kv span:first-child{color:var(--ink2)}
.scr .kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.scr .lock{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px dashed var(--rule2);color:var(--ink2);font-size:13.5px}
.scr .anim-tick{transition:none}
/* ───────── Page chrome around the phone ───────── */
html{--pg-bg:#E7E4DE;--pg-ink:#16171A;--pg-ink2:#5C5E64;--pg-ink3:#8C8E93;--pg-rule:#D6D2CA;--pg-card:#F4F2EE}
html[data-pg=dark]{--pg-bg:#0C0D0E;--pg-ink:#EFEDE8;--pg-ink2:#A7A6A2;--pg-ink3:#6E6E72;--pg-rule:#26272A;--pg-card:#141517}
body{margin:0;background:var(--pg-bg);color:var(--pg-ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.pg-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:14px 28px;background:color-mix(in srgb,var(--pg-bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--pg-rule);flex-wrap:wrap}
.pg-brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.pg-brand svg{--ink:#16171A;--e1:#EDB8A7;--e2:#DD7C60;--e3:#CC4528}
html[data-pg=dark] .pg-brand svg{--ink:#EFEDE8;--e1:#6E3528;--e2:#A94B33;--e3:#EE6646}
.pg-brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.pg-brand span{display:block;font-size:12px;color:var(--pg-ink2)}
.pg-seg{display:inline-flex;background:color-mix(in srgb,var(--pg-ink) 7%,transparent);border-radius:10px;padding:3px}
.pg-seg button{height:30px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--pg-ink2);white-space:nowrap}
.pg-seg button.on{background:var(--pg-card);color:var(--pg-ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pg-ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pg-lab{font-size:12px;color:var(--pg-ink3)}
.pg-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.085em;text-transform:uppercase;color:var(--pg-ink3)}

/* Prototype */
.pg-proto{display:grid;grid-template-columns:230px 1fr 300px;gap:28px;padding:20px 28px 28px;max-width:1360px;margin:0 auto;align-items:start}
.pg-nav{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;scrollbar-width:thin;padding-right:6px}
.pg-navg{margin-bottom:16px}

.pg-nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:6px 10px;border-radius:8px;font-size:13.5px;color:var(--pg-ink2)}
.pg-nav button:hover{background:color-mix(in srgb,var(--pg-ink) 5%,transparent)}
.pg-nav button.on{background:var(--pg-ink);color:var(--pg-bg);font-weight:500}
.pg-nav button i{font-style:normal;font-size:10.5px;opacity:.6}
.pg-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.pg-phone{border-radius:50px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 30px 60px -20px rgba(20,20,22,.28),0 12px 24px -12px rgba(20,20,22,.18)}

.pg-hint{font-size:12.5px;color:var(--pg-ink3);max-width:360px;text-align:center}
.pg-notes{position:sticky;top:84px;font-size:14px;line-height:1.5;color:var(--pg-ink2)}
.pg-notes h2{font-family:'Anybody';font-style:italic;font-size:26px;font-weight:800;font-stretch:82%;letter-spacing:-.01em;color:var(--pg-ink);margin:6px 0 10px;line-height:1.15}
.pg-notes p{margin:0 0 6px}
.pg-small{font-size:13px}
.pg-sep{height:1px;background:var(--pg-rule);margin:18px 0}
.pg-jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pg-jumps button{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--pg-rule);font-size:12.5px;color:var(--pg-ink)}

/* Board */
.pg-board{padding:28px 28px 80px;max-width:2000px;margin:0 auto}
.pg-btop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.pg-btop h1{font-family:'Anybody';font-style:italic;font-size:38px;font-weight:800;font-stretch:82%;letter-spacing:-.01em;margin:0}
.pg-btop p{margin:4px 0 0;color:var(--pg-ink2);font-size:14px}
.pg-bgroup{border-top:1px solid var(--pg-rule);padding:22px 0 8px}
.pg-bgroup h3{font-size:18px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.pg-bgroup h3 span{font-weight:400;font-size:13px;color:var(--pg-ink3);margin-left:10px}
.pg-row{display:flex;flex-wrap:wrap;gap:26px 22px}
.pg-fr{margin:0;cursor:pointer}
.pg-fr figcaption{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:8px;color:var(--pg-ink2)}
.pg-fr figcaption b{color:var(--pg-ink);font-weight:600}
.pg-frs{border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 16px 34px -18px rgba(20,20,22,.3)}
.pg-fr:hover .pg-frs{box-shadow:0 0 0 2px var(--pg-ink),0 16px 34px -18px rgba(20,20,22,.3)}
.pg-frs .scr *{pointer-events:none}

/* System */
.pg-sys{max-width:880px;margin:0 auto;padding:36px 28px 100px}
.pg-sys section{margin-bottom:44px}
.pg-sys h1{font-family:'Anybody';font-style:italic;font-size:50px;font-weight:800;font-stretch:80%;letter-spacing:-.015em;line-height:1.02;margin:10px 0 14px}
.pg-lead{font-size:17px;line-height:1.55;color:var(--pg-ink2);max-width:720px}
.pg-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin-top:22px;font-size:14px;line-height:1.5;color:var(--pg-ink2)}
.pg-facts b{display:block;color:var(--pg-ink);font-weight:600;margin-bottom:2px}
.pg-sys .pg-eyebrow{margin-bottom:12px}
.scr.sysbox{width:auto;height:auto;overflow:visible;border-radius:18px}
.pg-sws{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px}
.pg-sw i{display:block;height:52px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);margin-bottom:8px}
.pg-sw b{display:block;font-size:13px;font-weight:600}
.pg-sw span{display:block;font-size:12px;color:var(--ink2)}
.pg-score{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--pg-card);border-radius:14px;overflow:hidden}
.pg-score th,.pg-score td{text-align:left;padding:10px 14px;border-top:1px solid var(--pg-rule);vertical-align:top}
.pg-score th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pg-ink3);font-weight:600;border-top:0}
.pg-score td:first-child{font-weight:600;white-space:nowrap}
.pg-score .m{color:#2C7649}.pg-score .w{color:#8F560A}.pg-score .x{color:#B23B20}

html[data-pg=dark] .pg-score .w{color:#E8B66A}

/* Solo render */
.solo .scr{border-radius:0}

@media (max-width:1100px){.pg-proto{grid-template-columns:1fr}.pg-nav,.pg-notes{position:static;max-height:none}.pg-nav{display:flex;flex-wrap:wrap;gap:12px}}

/* The session strip: every run drawn to scale, height = effort.
   A set of short repeats (6 × 20 s strides, 8 × 45 s hills) is drawn as one block cut into
   one segment per rep, so it reads as "6 things" instead of a comb of slivers. */
let STRIP_V = 'timeline';           // timeline (shipped) · segments · profile
const SET_PX = 26;                  // a repeat unit narrower than this joins a set
function groupSets(bl, px) {
  const total = sum(bl.map(x => x[1]));
  const eq = (x, y) => x && y && x[0] === y[0] && Math.abs(x[1] - y[1]) < 1e-6, out = [];
  for (let i = 0; i < bl.length;) {
    const a = bl[i], b = bl[i + 1]; let n = 0, j = i;
    while (eq(bl[j], a) && eq(bl[j + 1], b)) { n++; j += 2; }
    if (n >= 3 && (a[1] + b[1]) / total * px < SET_PX) { out.push([Math.max(a[0], b[0]), n * (a[1] + b[1]), {n}]); i = j; }
    else { out.push(a); i++; }
  }
  return out;
}
function collapseReps(bl) {   // week minis: any short or many repeats become one striped block
  const eq = (x, y) => x && y && x[0] === y[0] && Math.abs(x[1] - y[1]) < 1e-6, out = [];
  for (let i = 0; i < bl.length;) {
    const a = bl[i], b = bl[i + 1]; let n = 0, j = i;
    while (eq(bl[j], a) && eq(bl[j + 1], b)) { n++; j += 2; }
    if (n >= 4 || (n >= 2 && a[1] < 2)) { out.push([Math.max(a[0], b[0]), n * (a[1] + b[1]), 'rep']); i = j; } else { out.push(a); i++; }
  }

function stripLayout(blocks, px, mini, gap) {
  const minRun = mini ? 2.5 : 8, minWalk = mini ? 1.5 : 5;
  const n = blocks.length, avail = px - gap * (n - 1);
  const mins = blocks.map(b => b[2] && b[2].n ? b[2].n * 8 + (b[2].n - 1) * 2 : b[0] === 0 ? minWalk : minRun);
  const fixed = new Array(n).fill(false);
  let w = [];
  for (let k = 0; k < 6; k++) {
    const fixedPx = mins.reduce((a, m, i) => a + (fixed[i] ? m : 0), 0);
    const freeT = blocks.reduce((a, bl, i) => a + (fixed[i] ? 0 : bl[1]), 0);
    w = blocks.map((bl, i) => fixed[i] ? mins[i] : bl[1] / freeT * (avail - fixedPx));
    let changed = false;
    w.forEach((x, i) => { if (!fixed[i] && x < mins[i]) { fixed[i] = true; changed = true; } });
    if (!changed) break;
  }

function strip(sess, o = {}) {

  const total = sum(blocks.map(b => b[1]));
  const flat = V === 'timeline';
  const h = o.h || (flat ? 36 : 64);
  const gap = mini ? 1.5 : V === 'profile' ? 0 : 3;
  const {L, tx} = stripLayout(blocks, px, mini, gap);
  const P = v => (v / px * 100).toFixed(3) + '%';
  const ht = e => flat ? 100 : H[e] * 100;

  const corners = w => { const r = rad(w).toFixed(1); return flat ? `${r}px` : `${r}px ${r}px ${mini ? 0 : 2}px ${mini ? 0 : 2}px`; };

    const xp = tx(Math.min(o.at, total)) / px * 100;
    inner = draw('ghost') + `<div style="position:absolute;inset:0;clip-path:inset(-30px ${100 - xp}% 0 0)">${draw('')}</div>`
      + `<div class="now" style="left:${xp}%"><b style="${xp > 86 ? 'left:auto;right:-1px;transform:none' : xp < 14 ? 'left:-1px;transform:none' : ''}">${o.atLabel || ''}</b></div>`;
  } else if (o.actual) {
    const act = groupSets(o.actual, px);
    let t = 0;
    const done = act.map(([e, m, set]) => { const l = tx(t), r = tx(t + m); t += m;
      return one(l, Math.max(3, r - l - (r - l > 12 ? gap : 0)), e, '', set); }).join('');
    if (flat) {   // plan and done as two bars on one time scale
      const row = (lab, body) => `<div class="pvd"><span>${lab}</span><div class="strip v-timeline" style="height:${h}px">${body}</div></div>`;
      return row('Plan', draw('')) + row('Done', done);
    }
    inner = done + L.filter(r => r.w > 10).map(r => `<div class="blk str" style="left:${P(r.l)};width:${P(r.w)};height:${H[r.e] * 100}%;border-radius:${corners(r.w)}"></div>`).join('');
  } else inner = draw(o.miss ? 'miss' : '');
  if (o.gels) inner += o.gels.map(g => `<div class="gel" style="left:${tx(g) / px * 100}%"></div>`).join('');
  let html = `<div class="strip v-${V}${o.cls ? ' ' + o.cls : ''}" style="height:${h}px${o.w ? ';width:' + o.w : ''}">${inner}${flat ? '' : '<div class="base"></div>'}</div>`;
  if (o.labels !== false && s.labels && !mini) {
    html += `<div class="strip-l">${s.labels.map(([a, b, ti, d]) => {
      const right = a / total > .6;
      return `<span class="${right ? 'r' : ''}" style="left:${(right ? tx(b) : tx(a)) / px * 100}%"><b>${ti}</b>${d}</span>`;
    }).join('')}</div>`;
  }
  if (o.axis) html += `<div class="strip-ax">${o.axis.map(x => `<span>${x}</span>`).join('')}</div>`;
  if (o.axisT) html += `<div class="strip-ax" style="position:relative;height:14px">${o.axisT.map((m, i) => { const x = tx(m) / px * 100;
    return `<span style="position:absolute;left:${x}%;transform:translateX(${i === 0 ? '0' : i === o.axisT.length - 1 ? '-100%' : '-50%'})">${m}${i === o.axisT.length - 1 ? ' min' : ''}</span>`; }).join('')}</div>`;
  return html;
}
function mini(key, axisMax, extra = {}) {
  const s = S[key];
  if (!s) return '';
  if (s.strength) return `<span class="flex xs faint" style="gap:5px">${I('dumbbell', 16)}${s.name.replace('Strength ', '')} min</span>`;
  const w = Math.max(8, s.min / axisMax * 100);
  return strip(key, {h: STRIP_V === 'timeline' ? 10 : 16, mini: true, labels: false, w: w + '%', px: 92 * w / 100, cls: 'mini', ...extra});
}

function weekRows(stage, opts = {}) {
  const w = opts.rows || W[stage].week;
  const axisMax = Math.max(...w.map(r => (S[r[1]] && S[r[1]].min) || 0));
  return `<div class="wk rows">${w.map(([d, k, st, note]) => {
    const s = S[k];
    let stt = '';
    if (st === 'done') stt = `<span class="flex" style="justify-content:flex-end;gap:4px">${I('check', 14)}${note.replace('✓ ', '')}</span>`;
    else if (st === 'today') stt = `<span class="flex w6" style="justify-content:flex-end;gap:6px;color:var(--ink)"><i class="dot"></i>Today</span>`;
    else if (st === 'moved') stt = `<span class="chip">${I('move', 12)}Moved</span>`;
    else if (st === 'missed') stt = `<span class="chip">Missed</span>`;
    else if (st === 'rest') stt = '';
    else stt = note ? note : (s && s.min ? s.min + ' min' : '');
    const name = s ? (s.short || s.name) : 'Rest';
    return `<div class="row${st === 'today' ? ' today' : ''}${st === 'rest' ? ' rest' : ''}" ${s ? `data-go="${st === 'today' ? 'session' : st === 'done' ? 'summary' : s.strength ? 'strength' : 'session'}"` : ''}>
      <div class="day">${d}</div><div class="nm">${name}</div>
      <div class="sp">${s ? mini(k, axisMax) : ''}</div>
      <div class="stt">${stt}</div></div>`;
  }).join('')}</div>`;
}

function grade(g) { return `<span class="grade" title="Evidence grade">${g}</span>`; }
function gradeWords(g) { return {A:'Strong evidence', B:'Moderate evidence', C:'Early evidence'}[g]; }

function ladderBar(stage, p) {
  return `<div class="ladder">${STAGES.map(s => `<div class="st${s.n < stage ? ' done' : ''}">${s.n === stage ? `<i style="width:${Math.max(6, p * 100)}%"></i>` : ''}</div>`).join('')}</div>
  <div class="ladder-l">${STAGES.map(s => `<span class="${s.n === stage ? 'on' : ''}">${s.name}</span>`).join('')}</div>`;
}

function weekBars(cfg, opts = {}) {
  const vals = cfg.vals, max = Math.max(...vals) * 1.15;
  const last = vals.length - 1, sel = cfg.part ? last - 1 : last;
  const fmt = v => cfg.unit === 'h' ? (Math.floor(v) + ' h ' + String(Math.round((v % 1) * 60)).padStart(2, '0')) : v + ' min';
  return `<div class="bars" style="height:${opts.h || 120}px">${vals.map((v, i) => {
    const cls = i === sel ? 'on' : (cfg.part && i === last) || cfg.miss === i ? 'part' : '';
    return `<div class="b ${cls}" style="height:${Math.max(3, v / max * 100)}%">${i === sel ? `<span class="cv"${i > vals.length - 3 ? ' style="left:auto;right:-4px;transform:none"' : ''}>${fmt(v)}</span>` : ''}${cfg.part && i === last ? `<span class="pv">${fmt(v)}</span>` : ''}</div>`;
  }).join('')}</div><div class="bars-x">${cfg.x.map((x, i) => `<span class="${i === sel ? 'on' : ''}">${x}</span>`).join('')}</div>`;
}

/* Line with a shaded "your normal" band */
function lineBand(pts, lo, hi, o = {}) {
  const w = 350, h = o.h || 130, pad = 8;
  const all = [...pts, ...lo, ...hi];
  const mn = Math.min(...all), mx = Math.max(...all);
  const X = i => pad + i / (pts.length - 1) * (w - pad * 2 - 30);
  const Y = v => o.invert ? pad + (v - mn) / (mx - mn) * (h - pad * 2) : h - pad - (v - mn) / (mx - mn) * (h - pad * 2);
  const band = lo.map((v, i) => `${X(i)},${Y(v)}`).join(' ') + ' ' + hi.map((v, i) => `${X(hi.length - 1 - i)},${Y(hi[hi.length - 1 - i])}`).join(' ');
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${pad + f * (h - pad * 2)}" y2="${pad + f * (h - pad * 2)}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">${grid}
    <polygon points="${band}" fill="var(--e1)" opacity=".38"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((v, i) => i < pts.length - 1 ? `<circle cx="${X(i)}" cy="${Y(v)}" r="2.2" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.4"/>` : '').join('')}
    <circle cx="${lx}" cy="${ly}" r="5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2.5"/>
    ${o.tag ? `<g transform="translate(${lx + 8},${ly - 12})"><rect x="0" y="0" width="${o.tag.length * 6.6 + 12}" height="22" rx="6" fill="var(--ink)"/><text x="6" y="15" font-size="11.5" font-weight="600" fill="var(--bg)" font-family="Hanken Grotesk">${o.tag}</text></g>` : ''}
  </svg>
  ${o.x ? `<div class="strip-ax">${o.x.map(t => `<span>${t}</span>`).join('')}</div>` : ''}`;
}

/* Weather-style range bar */
function rangeBar(lo, hi, likely, min, max, mark) {
  const P = v => (v - min) / (max - min) * 100;
  return `<div class="rng"><div class="tr"></div><div class="band" style="left:${P(lo)}%;width:${P(hi) - P(lo)}%"></div>
    ${mark != null ? `<div class="mk" style="left:${P(mark)}%"></div>` : ''}<div class="pt" style="left:${P(likely)}%"></div></div>`;
}

/* Route map: hand-drawn park loop with privacy zones at start and end */
function routeMap(o = {}) {
  return `<div class="map"><svg viewBox="0 0 350 190" preserveAspectRatio="xMidYMid slice">
    <defs><pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="var(--rule2)"/></pattern></defs>
    <path d="M-10 150 C60 140 90 168 170 160 S300 128 360 140 L360 200 L-10 200z" fill="var(--well2)" opacity=".8"/>
    <path d="M120 -10 C130 40 150 70 210 80 S320 70 360 40" fill="none" stroke="var(--rule2)" stroke-width="9" stroke-linecap="round" opacity=".7"/>
    <path d="M20 30 L340 18 M30 110 L330 96 M90 0 L70 190 M260 0 L280 190" stroke="var(--rule)" stroke-width="5"/>
    <ellipse cx="190" cy="104" rx="118" ry="58" fill="var(--bg)" opacity=".55"/>
    <path d="M84 132 C70 104 86 64 132 54 C176 44 240 46 282 66 C316 82 312 128 276 142 C236 158 168 160 126 150 C112 147 98 144 92 138"
      fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${o.strides ? `<path d="M212 151 C190 155 166 156 142 152" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" opacity=".9"/>` : ''}
    ${[[110,58,'1'],[175,47,'2'],[238,51,'3'],[298,86,'4'],[266,146,'5'],[180,156,'6']].map(([x,y,t]) => `<g transform="translate(${x},${y})"><circle r="8" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.4"/><text y="3.6" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--ink)" font-family="Hanken Grotesk">${t}</text></g>`).join('')}
    <circle cx="74" cy="146" r="26" fill="url(#hz)" stroke="var(--rule2)" stroke-dasharray="3 3"/>
    <text x="74" y="185" text-anchor="middle" font-size="10" fill="var(--ink2)" font-family="Hanken Grotesk">start/end hidden</text>
  </svg></div>`;
}

function topnav(left = 'back', title = '', right = '') {
  const l = left === 'back' ? `<button class="ib" data-go="back" aria-label="Back">${I('chevL', 24)}</button>`
    : left === 'close' ? `<button class="ib" data-go="back" aria-label="Close">${I('x', 22)}</button>` : `<span style="width:40px"></span>`;
  return `<div class="topnav">${l}<span class="h3" style="font-size:15px">${title}</span>${right || '<span style="width:40px"></span>'}</div>`;
}

function evidence(g, conf) {
  return `<span class="gradechip">${grade(g)}${gradeWords(g)}${conf ? ' · ' + conf : ''}</span>`;
}

def('session', {group:'Today', title:'Session detail', notab:true, note:'Every step with duration, talk-test effort and (from Stage 2) pace. The spike guard is checked before the run, and the workout is sent to the watch (Apple WorkoutKit, Garmin Training API, COROS).'}, (c) => {
  const w = W[c.stage], s = S[w.today], h = w.hero;
  const mm = m => { const t = Math.round(m * 60); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const eq = (x, y) => x && y && x[0] === y[0] && Math.abs(x[1] - y[1]) < 1e-6;
  const merged = [];
  for (let i = 0; i < s.blocks.length;) {   // collapse a,b,a,b… into one "n ×" step
    const a = s.blocks[i], b = s.blocks[i + 1]; let n = 0, j = i;
    while (eq(s.blocks[j], a) && eq(s.blocks[j + 1], b)) { n++; j += 2; }
    if (n >= 2) { merged.push({rep:n, a, b}); i = j; } else { merged.push({one:a}); i++; }
  }
  const paces = {2:['', '6:50–7:20 /km'], 3:['', '6:05–6:35 /km', '5:25–5:45 /km', 'fast and relaxed, not a sprint'], 4:['', '5:30–5:55 /km', '4:58 /km', '4:05 /km'], 5:['', '4:50–5:20 /km', '4:15 /km', '3:26 /km · 318–326 W']};
  const pz = (e) => (paces[c.stage] || [])[e] || '';
  const word = e => ['walk', 'easy', 'steady', 'fast'][e];
  const stepRow = (x, i) => x.rep
    ? `<div class="st"><span class="i">0${i + 1}</span><span><span class="sw" style="background:var(--e${x.a[0]})"></span>${x.rep} × ${word(x.a[0])} ${mm(x.a[1])}, ${word(x.b[0])} ${mm(x.b[1])}<span class="w">${EFFORT[x.a[0]].talk}${pz(x.a[0]) ? ' · ' + pz(x.a[0]) : ''}</span></span><span class="d">${mm(x.rep * (x.a[1] + x.b[1]))}</span></div>`
    : `<div class="st"><span class="i">0${i + 1}</span><span><span class="sw" style="background:var(--e${x.one[0]})"></span>${x.one[0] === 0 ? 'Walk' : EFFORT[x.one[0]].k + ' run'}<span class="w">${EFFORT[x.one[0]].talk}${pz(x.one[0]) ? ' · ' + pz(x.one[0]) : ''}</span></span><span class="d">${mm(x.one[1])}</span></div>`;
  const spike = {1:null, 2:['Today about 4.2 km','Longest in the last 30 days: 5.4 km'], 3:['Today about 6.5 km','Longest in the last 30 days: 12.4 km'], 4:['Today about 12.4 km','Longest in the last 30 days: 30.0 km'], 5:['Today about 11.6 km','Longest in the last 30 days: 28.0 km']}[c.stage];
  return {body:`
    ${topnav('back', 'Wed 28 Oct', `<button class="ib" aria-label="More">${I('more', 22)}</button>`)}
    <div class="eyebrow">Session · ${s.min} min</div>
    <div class="gap8"></div>
    <div class="h1">${h.title}</div>
    <div class="gap24"></div>
    ${strip(w.today, {axisT:[0, Math.round(s.min / 4), Math.round(s.min / 2), Math.round(s.min * 3 / 4), s.min]})}
    <div class="sec" style="margin-top:16px"><div class="steps">${merged.map(stepRow).join('')}</div></div>
    ${spike ? `<div class="sec"><div class="flex" style="gap:12px;align-items:flex-start"><span class="ic" style="width:34px;height:34px;border-radius:10px;background:var(--goodT);color:var(--good);display:flex;align-items:center;justify-content:center;flex:none">${I('shield', 18)}</span>
      <div class="grow"><div class="t w6">Spike guard: fine</div><div class="sm mute">${spike[0]}. ${spike[1]}. A single run more than 10% past that raises injury risk; today is well inside.</div><div class="gap8"></div>${evidence('B')}</div></div></div>` : ''}
    <div class="sec"><div class="hd"><span class="eyebrow">Voice cues</span></div>
      <div class="rows">
        <div class="row" style="min-height:46px"><div class="grow t">${c.stage === 1 ? '“Run now” / “Walk now”' : 'Each block change, with the target'}</div><span class="toggle on"></span></div>
        <div class="row" style="min-height:46px"><div class="grow t">${c.stage === 1 ? 'Halfway, and the last run' : 'Every kilometre: time and pace'}</div><span class="toggle${c.stage === 1 ? ' on' : ' on'}"></span></div>
        <div class="row" style="min-height:46px"><div class="grow t">Spike guard warning</div><span class="xs faint">Always on</span></div>
      </div></div>
    <div class="sec"><div class="hd"><span class="eyebrow">On your wrist</span></div>
      <div class="rows"><div class="row"><span class="ic">${I('watch', 18)}</span><div class="grow"><div class="t">Apple Watch Ultra 2</div><div class="s">In the Workout app as “Steady · ${s.name}”</div></div><span class="chip good">${I('check', 13)}Sent 06:12</span></div></div></div>`,
    foot:`<button class="btn" data-go="live">${I('play', 20)}Start run</button>`};
});

/* ── Sheets over Today ── */
def('move', {group:'Today', title:'Can’t run today? (sheet)', base:'today', notab:true, note:'Move, swap, shorten or skip: one tap, consequences stated before you choose. We never add missed minutes back.'}, (c) => ({sheet:`

  <div class="tagset"><button>Why is today easy?</button><button>Can I race a 10K on Sunday?</button></div>
  <div class="gap12"></div>
  <div class="field"><span class="ph grow">Ask about your running…</span>${I('arrowUp', 18, 'style="color:var(--ink3)"')}</div>`}));

def('lapse', {group:'Today', title:'Back after a break', tab:'today', stage:2, note:'After 2 missed weeks: a gentle restart week instead of a broken streak. Streaks count weeks, never days.'}, (c) => ({glow:true, body:`

/* ── Plan ── */
const PHASES = {
  1:[['Run/walk',6],['Longer runs',4]], 2:[['Every week',6],['First 5K',2]],
  3:[['Base',6],['Build',7],['Peak',5],['Taper',2]], 4:[['Base',4],['Build',6],['Peak',6],['Taper',2]],
  5:[['Base',8],['Brighton Half',2],['Marathon build',8],['Taper',2]]};
const PH_AT = {1:3, 2:5, 3:3, 4:13, 5:6};
function phaseBar(stage) {
  const ph = PHASES[stage], tot = sum(ph.map(p => p[1])), at = PH_AT[stage];
  let t = 0;
  return `<div style="position:relative;padding-top:26px">
    <div class="flex" style="gap:3px">${ph.map(([n, wks]) => { const s0 = t; t += wks;
      const done = Math.min(1, Math.max(0, (at - s0) / wks));
      return `<div style="flex:${wks};"><div class="bar" style="height:8px;border-radius:2px"><i style="width:${done * 100}%;border-radius:0"></i></div><div class="xs ${at > s0 && at <= t ? 'w6' : 'faint'}" style="margin-top:7px;white-space:nowrap">${n}</div></div>`; }).join('')}</div>
    <div class="now" style="position:absolute;top:0;left:calc(${(at - .5) / tot * 100}% );transform:translateX(-50%)"><span class="chip ink" style="height:20px">Week ${at}</span></div></div>`;
}
def('plan', {group:'Plan', title:'Plan', tab:'plan', note:'The block as phases, then the week as a timetable of strips on one time axis: the long run is visibly the longest. Spike guard is built into plan generation. Taper is automatic.'}, (c) => {
  const w = W[c.stage];
  const spike = {1:'Friday’s run/walk is the same length as today. Run minutes rise by 30 s at most.', 2:'Saturday’s 40 min (about 5.9 km) is 9% longer than your longest run this month (5.4 km). Under 10%, so it stays.', 3:'Sunday’s 13.1 km is 6% longer than your longest run in the last 30 days (12.4 km). Under 10%, fine.', 4:'Sunday’s 32 km is 7% longer than your longest run in the last 30 days (30 km). Under 10%, fine.', 5:'Sunday’s 26 km is shorter than your longest run in the last 30 days (28 km).'}[c.stage];
  return {body:`
    <div class="page-t">Plan</div>
    <div class="sm mute">${w.goalLine}</div>
    <div class="gap16"></div>
    ${phaseBar(c.stage)}
    <div class="sec" style="margin-top:22px">

        <div style="text-align:center"><div class="h3">This week</div><div class="xs faint">26 Oct – 1 Nov · ${w.weekSum}</div></div>
        <button class="ib well" style="width:32px;height:32px" aria-label="Next week">${I('chevR', 16)}</button></div>
      ${weekRows(c.stage)}

    </div>
    ${c.stage >= 2 ? `<div class="sec" data-go="changes">
      <div class="hd"><span class="eyebrow">What changed</span><button class="link">All changes${I('chevR', 14)}</button></div>
      ${changeEntry(changesFor(c.stage)[0], true)}
    </div>` : ''}
    <div class="sec">
      <div class="hd"><span class="eyebrow">Coming up</span></div>
      <div class="rows">
        ${c.stage >= 3 ? `<div class="row" data-go="${c.stage >= 4 ? 'race' : 'plan'}"><span class="ic">${I('easier', 18)}</span><div class="grow"><div class="t">Taper starts by itself</div><div class="s">${c.stage === 4 ? 'Sun 22 Nov: volume down 45% over 2 weeks, same intensity' : c.stage === 5 ? 'Brighton Half: 10 days, light. London: 2 weeks' : '2 weeks before Bath: volume down about 45%, same intensity'}</div></div>${grade('A')}</div>` : ''}
        <div class="row" data-go="strength"><span class="ic">${I('dumbbell', 18)}</span><div class="grow"><div class="t">Strength, twice a week</div><div class="s">${c.stage <= 2 ? 'Bodyweight · 15 min' : 'Heavy lifts and hops · 20 min'}</div></div>${I('chevR', 16, 'class="chev"')}</div>
        <div class="row" data-go="tests"><span class="ic">${I('target', 18)}</span><div class="grow"><div class="t">Self-tests</div><div class="s">${c.stage >= 3 ? 'Critical-speed test suggested in week 5' : 'Talk-test calibration run'}</div></div>${I('chevR', 16, 'class="chev"')}</div>
      </div>
    </div>`, tab:'plan'};
});

const CH4 = {when:'Mon 26 Oct, 06:05', who:'Plan', items:[['Mon','Easy 60','Easy 50'],['Tue','Intervals 6 × 1 km','Intervals 5 × 1 km']],
  because:[['Sleep','2 nights under 6 h'],['HRV','41 ms, below your normal 46–60'],['RPE','Sunday\u2019s long run felt 8/10'],['You','Said you felt \u201crough\u201d']], open:true};
const CH5 = {when:'Tue 27 Oct, 19:40', who:'Coach Sam', items:[['Wed','Easy 45','6 × 800 m'],['Thu','6 × 800 m','Easy 45']],
  because:[['Coach','\u201cTrack\u2019s free Wednesday, Thursday stays easy.\u201d']], open:true};
const CH2 = {when:'Today, 06:10', who:'Plan', items:[['Sat','Long 45','Long 40']],
  because:[['Spike guard','45 min would be about 19% past your longest run this month']], open:true};
function changesFor(stage) {
  const head = {2:CH2, 3:CHANGES[0], 4:CH4, 5:CH5}[stage];
  return head ? [head, ...CHANGES.slice(1)] : CHANGES.slice(1);
}
function changeEntry(ch, compact) {
  return `<div style="padding:${compact ? '0' : '16px 0'}">
    <div class="between"><span class="xs faint">${ch.when} · by ${ch.who}</span>${ch.open ? `<span class="flex" style="gap:14px"><button class="link">${I('undo', 14)}Undo</button></span>` : ''}</div>
    <div class="gap8"></div>
    ${ch.items.map(([d, a, b]) => `<div class="flex" style="gap:10px;padding:3px 0"><span class="xs w6 mute" style="width:30px">${d}</span><span class="sm"><s>${a}</s> <span class="faint">→</span> <b class="w6">${b}</b></span></div>`).join('')}
    <div class="gap8"></div>
    <div class="flex" style="flex-wrap:wrap;gap:6px">${ch.because.map(([k, t]) => `<span class="chip"><b class="w6" style="color:var(--ink)">${k}</b>${t}</span>`).join('')}</div>
  </div>`;
}
def('changes', {group:'Plan', title:'What changed', notab:true, note:'Every adaptation is listed with its reasons and can be undone. Inputs: missed sessions, RPE, niggles, HRV/sleep (soft), heat forecast, illness, coach edits. Nothing is rebuilt silently.'}, (c) => ({body:`
  ${topnav('back', 'What changed')}
  <div class="h1" style="margin:4px 0 6px">Every change, and why</div>

  <div class="sec"><div class="xs faint">HRV and sleep can soften a hard day. They never cancel one on their own, and you always have the last word.</div></div>`}));

def('strength', {group:'Plan', title:'Strength session', notab:true, note:'Strength on the same calendar as runs, progressing by stage: bodyweight at 1–2, heavy lifts and plyometrics from 3. Combined heavy + plyometric work has the best evidence for running economy.'}, (c) => {
  const heavy = c.stage >= 3;
  const ex = heavy ? [['Goblet squat','3 × 6','Heavy: last 2 reps hard'],['Romanian deadlift','3 × 6','Hinge, flat back'],['Step-up','3 × 8 each leg','Knee over toes is fine'],['Single-leg calf raise','3 × 10 each','Slow down, 3 s'],['Pogo hops','3 × 20 s','Quick, springy contacts'],['Bounds','3 × 6','Long and tall']]
    : [['Squat','2 × 12','Sit back, chest up'],['Split squat','2 × 8 each leg','Hold a wall if you need'],['Glute bridge','2 × 12','Squeeze at the top'],['Calf raise','2 × 15','Both legs, slow'],['Plank','2 × 30 s','Straight line'],['Side plank','2 × 20 s each','Hips high']];
  return {body:`
    ${topnav('back', 'Thu 29 Oct')}
    <div class="eyebrow">Strength · ${heavy ? '20' : '15'} min · ${heavy ? 'gym or home with weights' : 'no equipment'}</div>
    <div class="gap8"></div><div class="h1">${heavy ? 'Heavy legs and hops' : 'Bodyweight basics'}</div>

/* ───────── Screens: progress and insight, race, you ───────── */
def('progress', {group:'Progress', title:'Progress', tab:'progress', note:'The ladder and its graduation checks first, then weekly time as a familiar bar chart, then the numbers this stage has unlocked, each with its evidence grade. Stage 1 sees four numbers; Stage 5 sees power and the lab.'}, (c) => {
  const w = W[c.stage], st = stg(c.stage);
  const ms = METRICS.filter(m => m.s <= c.stage && (!m.until || c.stage < m.until));
  const nxt = c.stage < 4 ? 'To reach Stage ' + (c.stage + 1) + ' · ' + stg(c.stage + 1).name : c.stage === 4 ? 'Perform has no ceiling' : 'Top of the ladder';
  return {body:`
    <div class="page-t">Progress</div>
    <div class="sm mute">Stage ${c.stage} · ${st.name} · ${{1:'3 weeks here', 2:'5 weeks here', 3:'9 weeks here', 4:'31 weeks here', 5:'since 2025'}[c.stage]}</div>
    <div class="gap20"></div>
    ${ladderBar(c.stage, w.ladder.p)}
    <div class="sec" style="margin-top:22px">
      <div class="hd"><span class="eyebrow">${nxt}</span><span class="r">${w.ladder.checks.filter(x => x[2] >= 1).length} of ${w.ladder.checks.length}</span></div>
      <div class="rows">${w.ladder.checks.map(([t, s, p]) => `<div class="row" style="align-items:flex-start;gap:12px">
        <span style="width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;${p >= 1 ? 'background:var(--ink);color:var(--bg)' : 'border:1.5px solid var(--rule2)'}">${p >= 1 ? I('check', 14) : ''}</span>
        <div class="grow"><div class="t">${t}</div><div class="s">${s}</div>${p < 1 ? `<div class="bar" style="margin-top:9px"><i style="width:${Math.max(3, p * 100)}%"></i></div>` : ''}</div></div>`).join('')}</div>
      ${c.stage === 4 ? `<div class="gap8"></div><button class="link">Move up to Compete${I('chevR', 14)}</button>` : ''}
    </div>
    <div class="sec">
      <div class="hd"><span class="eyebrow">${w.weeks.label} · weekly</span><span class="r flex" style="gap:5px">${I('repeat', 14)}${w.streak}</span></div>
      <div class="gap20"></div>
      ${weekBars(w.weeks)}
      ${w.weeks.miss != null ? `<div class="xs faint" style="margin-top:10px">Hatched: a week off. Streaks count weeks, and a missed week pauses them.</div>` : ''}
    </div>
    <div class="sec">
      <div class="hd"><span class="eyebrow">Your numbers</span><span class="r">Tap to explain</span></div>
      <div class="rows">${ms.map(m => `<div class="row" data-go="${m.go || 'explain'}" style="align-items:flex-start;padding:13px 0">
        <div class="grow"><div class="t">${m.name}${m.lab ? ' <span class="chip line" style="height:18px;font-size:10.5px">Lab</span>' : ''}</div><div class="s">${m.note}</div></div>
        <div class="v" style="font-size:17px">${m.v}${m.u ? ` <span class="xs faint w5">${m.u}</span>` : ''}${m.d ? `<small class="${m.warn ? 'warnc' : 'goodc'}">${m.d}</small>` : m.warn ? '<small class="warnc">flagged</small>' : ''}</div>
        <span style="margin-top:2px">${grade(m.g)}</span></div>`).join('')}</div>
      <div class="xs faint flex" style="gap:6px;margin-top:10px">${grade('A')}<span>Strong</span>${grade('B')}<span>Moderate</span>${grade('C')}<span>Early: shown, never drives the plan alone</span></div>
    </div>
    <div class="sec">
      <div class="rows">
        <div class="row" data-go="report"><span class="ic">${I('file', 18)}</span><div class="grow"><div class="t">October report</div><div class="s">${c.stage === 1 ? 'Your first month, in plain English' : 'Steadier, not just more'}</div></div>${I('chevR', 16, 'class="chev"')}</div>
        ${c.stage >= 3 ? `<div class="row" data-go="predictor"><span class="ic">${I('target', 18)}</span><div class="grow"><div class="t">Race predictions</div><div class="s">Ranges, not one number</div></div>${I('chevR', 16, 'class="chev"')}</div>` : ''}
        ${c.stage >= 4 ? `<div class="row" data-go="race"><span class="ic">${I('lap', 18)}</span><div class="grow"><div class="t">Race kit · Valencia</div><div class="s">Pace plan, fuelling, taper</div></div>${I('chevR', 16, 'class="chev"')}</div>` : `<div class="lock">${I('lock', 18)}<span class="grow">Race kit, durability and HRV unlock at Stage 4 · Perform</span></div>`}
        <div class="row" data-go="tests"><span class="ic">${I('flask', 18)}</span><div class="grow"><div class="t">Self-tests</div><div class="s">Swap estimates for your own measurements</div></div>${I('chevR', 16, 'class="chev"')}</div>
      </div>
    </div>`, tab:'progress'};
});

def('metric', {group:'Progress', title:'Critical speed', notab:true, minStage:3, note:'Estimated from ordinary runs, re-checked weekly, shown with its range and confidence in words. Powers every pace zone and prediction. Line with a shaded "likely range" band: a familiar chart.'}, (c) => {
  const pts = [311,310,310,309,308,308,307,306,306,305,305,305];
  return {body:`
    ${topnav('back', '', `<button class="pillbtn" data-go="explain">${I('info', 16)}Explain</button>`)}
    <div class="eyebrow">Critical speed · re-checked Mon 26 Oct</div>
    <div class="gap12"></div>
    <div class="flex" style="align-items:baseline;gap:8px"><span class="disp d2">5:05</span><span class="unit" style="font-size:24px">/km</span><span class="sm faint" style="margin-left:auto">11.8 km/h</span></div>
    <div class="gap12"></div>

    <div class="gap24"></div>
    ${lineBand(pts, pts.map(v => v + 7), pts.map(v => v - 6), {invert:true, tag:'5:05', x:['Aug','Sep','Oct','Now']})}
    <div class="gap16"></div>
    <div class="h3" style="font-weight:500">6 s/km faster since August, from your everyday runs. No test needed.</div>
    <div class="sec" style="margin-top:20px">
      <div class="hd"><span class="eyebrow">It sets your paces</span></div>
      <div class="rows">${[[1,'Easy','Full sentences','6:05–6:35'],[2,'Steady','Short phrases','5:25–5:45'],[2,'Tempo','Short phrases','5:05–5:15'],[3,'Hard','A few words','under 4:50']].map(([e, n, t, p]) =>
        `<div class="row" style="min-height:48px"><span style="width:6px;height:${[0,14,22,30][e]}px;border-radius:2px;background:var(--e${e})"></span><div class="grow"><div class="t">${n}</div><div class="s">${t}</div></div><div class="v">${p}<span class="xs faint w5"> /km</span></div></div>`).join('')}</div>
    </div>
    <div class="sec">
      <div class="rows"><div class="row" data-go="tests"><span class="ic">${I('flask', 18)}</span><div class="grow"><div class="t">Make it sharper</div><div class="s">3-min + 12-min test · narrows the range to about ±2%</div></div><span class="link">Plan it</span></div></div>
    </div>`};
});

def('explain', {group:'Progress', title:'Explain this (sheet)', base:'metric', notab:true, minStage:3, note:'"Explain this" on every number, in three layers: one plain sentence for everyone; why it matters and what to do; the science with method, evidence grade, your range and the study. Beginners stay at layer 1.'}, (c) => ({sheet:`
  <div class="eyebrow">Explain this</div><div class="gap8"></div>
  <div class="h2">Critical speed: 5:05 /km</div>
  <div class="gap16"></div>
  <div class="layer" style="border-top:0;padding-top:0"><div class="lh"><span><span class="n">1</span>In one line</span></div>
    <p style="color:var(--ink);font-size:16px">The fastest pace you could hold for a long time, about 30 to 40 minutes. Yours is <b>6 s/km faster</b> than in August.</p></div>

  <div class="layer"><div class="lh"><span><span class="n">3</span>The science</span>${I('chevU', 16, 'style="color:var(--ink3)"')}</div>
    <div class="gap8"></div>
    <div class="kv"><span>Method</span><span>Best 3–20 min efforts, weekly</span></div>

    <div class="row" style="border-top:1px solid var(--rule)"><span class="ic">${I('book', 18)}</span><div class="grow"><div class="t" style="font-size:14px">Smyth & Muniz-Pumares, 2020</div><div class="s">Medicine & Science in Sports & Exercise</div></div>${I('link', 16, 'class="chev"')}</div>
  </div>
  <div class="gap8"></div>
  <button class="btn2" data-go="ask">${I('ask', 18)}Ask about this number</button>`}));

def('predictor', {group:'Progress', title:'Race predictions', notab:true, minStage:3, note:'Weather-style ranges, never one false-precise time. Combines critical speed, two recent races and weekly time (plain Riegel predicts marathons too fast). Says why a goal is or isn’t realistic.'}, (c) => {
  const s4 = c.stage >= 4;
  const rows = s4 ? [['5K','20:55',1220,1285,1255,'Fairly sure'],['10K','43:40',2560,2690,2620,'Fairly sure'],['Half','1:36:30',5650,5950,5790,'Fairly sure'],['Marathon','3:31',12360,13020,12660,'Fairly sure · 4 long runs over 28 km', 12600]]
    : [['5K','24:30',1435,1510,1470,'Fairly sure · you raced one in Sep'],['10K','51:40',3040,3180,3100,'Fairly sure'],['Half','1:59',6960,7380,7140,'Fairly sure', 7200],['Marathon','4:25',15120,17100,15900,'Rough estimate · needs long runs over 25 km']];
  return {body:`
    ${topnav('back', 'Race predictions')}
    <div class="h1" style="margin:4px 0 6px">What you could run now</div>
    <div class="sm mute">From your critical speed, your last two races and your weekly running. The dot is most likely; the bar is the honest range. Longer races are less certain, so their bars are wider.</div>
    <div class="gap12"></div>
    <div class="rows">${rows.map(([n, t, lo, hi, li, conf, goal]) => `<div class="row" style="display:block;padding:16px 0">
      <div class="between" style="align-items:baseline"><span class="h3">${n}</span><span class="disp d5">${t}</span></div>
      <div class="gap12"></div>${rangeBar(lo, hi, li, li * .9, li * 1.1, goal)}
      <div class="between xs" style="margin-top:6px"><span class="faint">${fmtT(lo)} – ${fmtT(hi)}</span><span class="${conf.startsWith('Rough') ? 'warnc' : 'mute'}">${conf}</span></div></div>`).join('')}</div>
    <div class="sec" style="margin-top:8px">
      <div class="rulel">
        <div class="eyebrow">Your goal · ${s4 ? 'Valencia under 3:30' : 'Bath Half under 2:00'}</div>
        <div class="gap8"></div>
        <div class="h3" style="font-weight:500;line-height:1.4">${s4 ? '3:30 needs about <b class="w6">85%</b> of your critical speed for three and a half hours. Runners at your level usually hold 82–86%. On track, not certain.' : '2:00 needs about <b class="w6">89%</b> of your critical speed for two hours. Runners at your level usually hold 87–91%. On track, not certain.'}</div>
      </div>
      <div class="gap12"></div><div class="xs faint flex" style="gap:6px"><i style="width:2px;height:12px;background:var(--ink);display:inline-block"></i>Line on the bar = your goal</div>
    </div>
    <div class="sec"><div class="note"><span class="ni">${I('info', 18)}</span><div class="nt sm">Why not one number? Simple formulas predict marathons too fast: by 10 minutes or more for half of recreational runners. We show a range and publish how close our predictions turn out.</div></div></div>`};
});
function fmtT(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = Math.round(s % 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }

def('report', {group:'Progress', title:'Monthly report', notab:true, note:'A plain-English month: what improved, what didn’t, what’s next, and progress to the next stage. Self-monitoring plus feedback are the best-supported behaviour-change techniques.'}, (c) => {
  const w = W[c.stage];

    ? {h:'Your first month. You kept showing up.', l:'8 runs in 3 weeks, every one done at an easy, chatty effort.', up:['Running minutes per run: from 4 to 9.','Longest non-stop run: from 1 minute to 1½.','Every run felt 4 or 5 out of 10, which is right.'], no:['One Friday missed. The plan moved it, nothing lost.'], nx:['Runs grow by 30 seconds when they feel easy.','By late November: 5 minutes non-stop.']}
    : {h:'Steadier, not just more.', l:'16 runs, 15 h 40 in October. More running than September, and more of it truly easy.', up:['Easy pace at 145 bpm: 6:02 /km, 12 s faster than August.','Critical speed: 5:05 /km, 6 s faster.','Easy runs done easy: 4 of 5 (September: 2 of 5).'], no:['Long run stuck at 12–13 km: two missed Thursdays, and we don’t add minutes back.','Strength: 5 of 8 sessions.'], nx:['Long runs build to 16 km by 22 Nov, never more than 10% past your longest.','A critical-speed test in week 5 to sharpen your zones.']};
  const li = (t, ic, col) => `<div class="flex sm" style="gap:10px;padding:7px 0;align-items:flex-start"><span style="color:${col};margin-top:1px">${I(ic, 16)}</span><span>${t}</span></div>`;
  return {body:`
    ${topnav('back', '', `<button class="ib" aria-label="Share">${I('share', 21)}</button>`)}
    <div class="eyebrow">October 2026 · monthly report</div>
    <div class="gap12"></div>
    <div class="hl" style="font-size:38px">${b.h}</div>
    <div class="gap12"></div><div class="lead">${b.l}</div>
    <div class="gap24"></div>
    ${weekBars({...w.weeks, vals:w.weeks.vals.slice(-5), x:['28 Sep','5 Oct','12','19','Now'], miss:null}, {h:90})}
    <div class="sec" style="margin-top:20px"><div class="hd"><span class="eyebrow">What improved</span></div>${b.up.map(t => li(t, 'arrowUp', 'var(--good)')).join('')}</div>

});

def('tests', {group:'Progress', title:'Self-tests', notab:true, note:'Built-in tests, each with "why do this" and a step-by-step guide: critical-speed 3 + 12 min, talk-test calibration, 5K time trial (parkrun), 30-min threshold and sweat-rate tests from Stage 4.'}, (c) => {

});

const SCORES = `<table class="pg-score">

</table>
<p style="font-size:13px;color:var(--pg-ink2);margin-top:14px;line-height:1.5">Round 2 swept all 34 screens at 390 px in light, and the core seven in dark, and fixed 15 smaller issues. Among them: race ranges moved to one shared scale so longer races show wider bands, the placement screen showed this week's ticks instead of a first-week plan, the now-label clipped at the end of a run, and the stage 4 what-changed log carried stage 3 entries. Two of my "matches" were wrong by your eye; round 3 is the fix.</p>
